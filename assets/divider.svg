<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" height="40">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00C2FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="40" fill="#0d1117"/>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#divGrad)" stroke-width="2">
    <animate attributeName="x1" values="-1200;1200" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2400" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>