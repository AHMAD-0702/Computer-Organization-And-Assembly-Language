<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF">
        <animate attributeName="stop-color" values="#00C2FF;#8A2BE2;#00C2FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8A2BE2">
        <animate attributeName="stop-color" values="#8A2BE2;#00C2FF;#8A2BE2" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .title {
        font-family: 'Courier New', monospace;
        font-size: 48px;
        font-weight: bold;
        fill: url(#grad);
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'Courier New', monospace;
        font-size: 20px;
        fill: #ffffff;
        text-anchor: middle;
        opacity: 0.8;
      }
      .wave {
        animation: wave 3s ease-in-out infinite;
      }
      @keyframes wave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    </style>
  </defs>
  <rect width="1200" height="200" fill="#0d1117"/>
  <g class="wave">
    <text x="600" y="90" class="title">⚙️ x86 Assembly Task Manager</text>
  </g>
  <text x="600" y="140" class="subtitle">Low-Level · Persistent · Pure Assembly</text>
</svg>