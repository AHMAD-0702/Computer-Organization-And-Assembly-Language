<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <defs>
    <style>
      .text {
        font-family: 'Courier New', monospace;
        font-size: 24px;
        fill: #00C2FF;
        font-weight: bold;
      }
      .cursor {
        fill: #00C2FF;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .line {
        stroke: #00C2FF;
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw 4s linear infinite;
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <rect width="800" height="100" fill="#0d1117" rx="10"/>
  <text x="40" y="60" class="text">
    &gt; nasm -f bin task.asm -o task.com
    <tspan class="cursor">_</tspan>
  </text>
</svg>