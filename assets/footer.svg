<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="150">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
    <style>
      .footer-text {
        font-family: 'Courier New', monospace;
        font-size: 22px;
        fill: #ffffff;
        text-anchor: middle;
        font-weight: bold;
      }
      .glow {
        animation: glow 2s ease-in-out infinite alternate;
      }
      @keyframes glow {
        from { filter: drop-shadow(0 0 5px #00C2FF); }
        to { filter: drop-shadow(0 0 20px #8A2BE2); }
      }
      .dot {
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>
  <rect width="1200" height="150" fill="#0d1117"/>
  <path d="M0,100 Q300,50 600,100 T1200,100 L1200,150 L0,150 Z" fill="url(#footGrad)" opacity="0.3"/>
  <text x="600" y="80" class="footer-text glow">⭐ Thanks for visiting! ⭐</text>
  <text x="600" y="120" class="footer-text">
    Made with <tspan class="dot">❤</tspan> by AHMAD-0702
  </text>
</svg>